<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

    <h1>Мои задачи</h1>

    <form id="task-form">
        <input
            id="task-input"
            type="text"
            placeholder="Новая задача..."
            autocomplete="off"
            required
        >

        <button type="submit">
            Добавить
        </button>
    </form>

    <div id="error" class="error"></div>

    <ul id="task-list"></ul>

</div>

<script src="/app.js"></script>

</body>
</html>
